<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title"><title id="title">Good ideas deserve to become real things. Let’s build what comes next.</title><style>text{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,serif;font-style:italic}.signal{animation:travel 14s linear infinite;stroke-dasharray:2 15}@keyframes travel{to{stroke-dashoffset:-170}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect width="600" height="280" rx="22" fill="#dfff83"/><text x="34" y="73" font-size="40" fill="#1e2a16" class="serif">Good ideas deserve</text><text x="34" y="126" font-size="40" fill="#1e2a16" class="serif">to become real things.</text><text x="35" y="214" font-size="19" fill="#344429" letter-spacing="1">LET’S BUILD WHAT COMES NEXT. ↗</text></svg>