<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title"><title id="title">Good ideas deserve to become real things. Let’s build.</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.signal{stroke-dasharray:9 18;animation:flow 4s linear 1}@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect width="1200" height="160" rx="18" fill="#f1ece3"/><text x="40" y="65" fill="#263138" font-size="34" font-weight="600">Good ideas deserve to become real things.</text><text x="40" y="113" fill="#b7522b" font-size="26">Let’s build. ↗</text></svg>