<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title"><title id="title">Six areas of AI Studio work</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.signal{stroke-dasharray:9 18;animation:flow 4s linear 1}@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect width="600" height="800" rx="18" fill="#f1ece3"/><text x="26" y="42" fill="#62665f" font-size="14" letter-spacing="2">ONE STUDIO. MANY WAYS TO MAKE WORK BETTER.</text><rect x="24" y="75" width="552" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="44" y="106" fill="#ad4825" class="mono" font-size="13">01</text><text x="44" y="137" fill="#222d34" font-size="25" font-weight="600">Knowledge &amp; search</text><text x="44" y="162" fill="#66717a" font-size="17">Find the answer. Keep the source.</text><rect x="24" y="192" width="552" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="44" y="223" fill="#ad4825" class="mono" font-size="13">02</text><text x="44" y="254" fill="#222d34" font-size="25" font-weight="600">People &amp; operations</text><text x="44" y="279" fill="#66717a" font-size="17">Build around the way teams work.</text><rect x="24" y="309" width="552" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="44" y="340" fill="#ad4825" class="mono" font-size="13">03</text><text x="44" y="371" fill="#222d34" font-size="25" font-weight="600">Travel &amp; planning</text><text x="44" y="396" fill="#66717a" font-size="17">Connect the moving parts.</text><rect x="24" y="426" width="552" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="44" y="457" fill="#ad4825" class="mono" font-size="13">04</text><text x="44" y="488" fill="#222d34" font-size="25" font-weight="600">Creative workflows</text><text x="44" y="513" fill="#66717a" font-size="17">Bring ideas through to handoff.</text><rect x="24" y="543" width="552" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="44" y="574" fill="#ad4825" class="mono" font-size="13">05</text><text x="44" y="605" fill="#222d34" font-size="25" font-weight="600">Revenue tools</text><text x="44" y="630" fill="#66717a" font-size="17">Make the next action clearer.</text><rect x="24" y="660" width="552" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="44" y="691" fill="#ad4825" class="mono" font-size="13">06</text><text x="44" y="722" fill="#222d34" font-size="25" font-weight="600">Developer experience</text><text x="44" y="747" fill="#66717a" font-size="17">Give builders better tools.</text></svg>