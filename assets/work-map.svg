<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="375" viewBox="0 0 1200 375" role="img" aria-labelledby="title"><title id="title">Six areas of AI Studio work</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.signal{stroke-dasharray:9 18;animation:flow 4s linear 1}@keyframes flow{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style><rect width="1200" height="375" rx="18" fill="#f1ece3"/><text x="26" y="42" fill="#62665f" font-size="14" letter-spacing="2">ONE STUDIO. MANY WAYS TO MAKE WORK BETTER.</text><rect x="24" y="74" width="372" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="44" y="105" fill="#ad4825" class="mono" font-size="13">01</text><text x="44" y="136" fill="#222d34" font-size="22" font-weight="600">Knowledge &amp; search</text><text x="44" y="161" fill="#66717a" font-size="16">Find the answer. Keep the source.</text><rect x="414" y="74" width="372" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="434" y="105" fill="#ad4825" class="mono" font-size="13">02</text><text x="434" y="136" fill="#222d34" font-size="22" font-weight="600">People &amp; operations</text><text x="434" y="161" fill="#66717a" font-size="16">Build around the way teams work.</text><rect x="804" y="74" width="372" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="824" y="105" fill="#ad4825" class="mono" font-size="13">03</text><text x="824" y="136" fill="#222d34" font-size="22" font-weight="600">Travel &amp; planning</text><text x="824" y="161" fill="#66717a" font-size="16">Connect the moving parts.</text><rect x="24" y="219" width="372" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="44" y="250" fill="#ad4825" class="mono" font-size="13">04</text><text x="44" y="281" fill="#222d34" font-size="22" font-weight="600">Creative workflows</text><text x="44" y="306" fill="#66717a" font-size="16">Bring ideas through to handoff.</text><rect x="414" y="219" width="372" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="434" y="250" fill="#ad4825" class="mono" font-size="13">05</text><text x="434" y="281" fill="#222d34" font-size="22" font-weight="600">Revenue tools</text><text x="434" y="306" fill="#66717a" font-size="16">Make the next action clearer.</text><rect x="804" y="219" width="372" height="105" rx="12" fill="#fffdf8" stroke="#dfd9cf"/><text x="824" y="250" fill="#ad4825" class="mono" font-size="13">06</text><text x="824" y="281" fill="#222d34" font-size="22" font-weight="600">Developer experience</text><text x="824" y="306" fill="#66717a" font-size="16">Give builders better tools.</text></svg>