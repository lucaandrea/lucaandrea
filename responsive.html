<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luca — Mobile profile preview</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e5dc;color:#30383d;font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #c7c8bd}a{color:inherit}button{font:inherit;cursor:pointer;border:1px solid #b9bcb4;background:#faf8f2;color:#30383d;border-radius:5px;padding:8px 13px}main{padding:30px 10px;text-align:center}h1{font-size:19px;font-weight:500;margin:0 0 8px}p{color:#717870;font-size:11px;margin:0 0 20px}.frame{display:block;width:390px;height:844px;max-width:100%;margin:0 auto;border:8px solid #202c34;border-radius:25px;background:#faf8f3;box-shadow:0 22px 50px #17252c25}button[aria-pressed=true]{background:#26353e;color:#fff;border-color:#26353e}@media(max-width:600px){header{font-size:11px;flex-wrap:wrap}.frame{height:75vh}}</style></head><body><header><a href="index.html">← Full preview</a><span>LOCAL PHONE-SIZED PREVIEW</span><div><button data-page="index.html" aria-pressed="true">HTML experience</button> <button data-page="github.html" aria-pressed="false">GitHub layout</button></div></header><main><h1>Small screen. Same point of view.</h1><p>374 CSS-pixel content viewport · scroll and interact inside the frame.</p><iframe class="frame" src="index.html" title="Interactive mobile profile preview"></iframe></main><script>document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('iframe').src=button.dataset.page;document.querySelectorAll('[data-page]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}))</script></body></html>
