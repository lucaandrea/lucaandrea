name: Refresh public profile

on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'

permissions:
  contents: write

concurrency:
  group: public-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Keep private review copies inactive until the owner makes them public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh public metadata
        run: node scripts/refresh-public-stats.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- assets/activity.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg
          git commit -m 'chore(profile): refresh public GitHub snapshot'
          git push
